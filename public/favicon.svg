<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- brand-500 -->
      <stop offset="100%" stop-color="#22d3ee" /> <!-- accent-400 -->
    </linearGradient>
  </defs>
  
  <!-- Тонкий круг -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad)" stroke-width="4" />
  
  <!-- Одна заглавная буква E -->
  <text x="50" y="65" font-family="'Great Vibes', cursive" font-size="70" fill="url(#grad)" text-anchor="middle" dominant-baseline="middle">
    E
  </text>
</svg>