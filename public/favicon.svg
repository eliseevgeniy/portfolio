<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  
  <!-- Круг (радиус 40, центр строго по 50,50) -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad)" stroke-width="4" />
  
  <!-- Буква (размер 50, выровнена по центру) -->
  <text x="50" y="50" font-family="'Great Vibes', cursive" font-size="50" fill="url(#grad)" text-anchor="middle" dominant-baseline="central">
    E
  </text>
</svg>